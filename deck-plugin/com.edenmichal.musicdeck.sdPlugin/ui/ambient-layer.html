<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ambient Layer</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Layer">
      <sdpi-select setting="soundId" datasource="getLayers" hot-reload loading="Loading layers…" placeholder="Pick a layer"></sdpi-select>

    </sdpi-item>
  </body>
</html>
