<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SFX Pad</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Sound">
      <sdpi-select setting="soundId" datasource="getSfx" hot-reload loading="Loading sounds…" placeholder="Pick a sound"></sdpi-select>
    </sdpi-item>
    <sdpi-item>
      <p style="margin: 0; opacity: 0.7; font-size: 11px;">The list comes from your “Music Deck – SFX” playlist in Foundry. Add sounds from the Library in the Playlists tab.</p>
    </sdpi-item>
  </body>
</html>
